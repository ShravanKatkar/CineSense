# fly.toml app configuration file for CineSense
# Deploy to Fly.io using: fly launch / fly deploy

app = "cinesense"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/api/v1/health"

[env]
  ENVIRONMENT = "production"
  CORS_ORIGINS = '["*"]'

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

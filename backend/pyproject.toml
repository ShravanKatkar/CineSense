[project]
name = "cinesense-backend"
version = "0.1.0"
description = "CineSense — AI Engineering Movie Recommendation & RAG System"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "cachetools>=5.3.3",
    "slowapi>=0.1.9",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "scikit-learn>=1.4.1.post1",
    "scipy>=1.12.0",
    "implicit>=0.7.2",
    "anthropic>=0.21.0",
    "voyageai>=0.2.1",
    "pyarrow>=15.0.0",
    "matplotlib>=3.8.0",
    "tabulate>=0.9.0",
    "pgvector>=0.2.5",
    "email-validator>=2.0.0",
    "alembic>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.3",
    "mypy>=1.9.0",
    "ipykernel>=6.29.3",
    "jupyter>=1.0.0",
    "sentence-transformers>=2.6.1",
]

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = [".", "app", ".."]
asyncio_mode = "auto"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

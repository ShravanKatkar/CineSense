# Render Infrastructure-as-Code Blueprint for CineSense
# Deploy with one click on https://render.com

services:
  # ── 1. Unified Application Service (React SPA + FastAPI REST) ──
  - type: web
    name: cinesense-app
    env: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cinesense-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cinesense-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: TMDB_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'

  # ── 2. Managed Redis Cache ──
  - type: redis
    name: cinesense-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal private access only

# ── 3. PostgreSQL 16 Database with Vector Support ──
databases:
  - name: cinesense-db
    databaseName: cinesense
    user: cinesense
    plan: standard
    region: oregon
    postgresMajorVersion: 16

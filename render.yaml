# Render Infrastructure-as-Code Blueprint for CineSense (100% FREE Tier)
# Deploy on https://render.com with $0 cost

services:
  # ── 1. Unified Application Service (React 19 SPA + FastAPI REST) ──
  - type: web
    name: cinesense-app
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cinesense-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: TMDB_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'

# ── 2. PostgreSQL 16 Database (Free Tier) ──
databases:
  - name: cinesense-db
    databaseName: cinesense
    user: cinesense
    plan: free
    region: oregon
    postgresMajorVersion: 16

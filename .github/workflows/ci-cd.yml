name: CineSense CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── 1. Unit Tests & Static Build Validation ──
  test:
    name: Test Backend & Frontend
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cinesense
          POSTGRES_USER: cinesense
          POSTGRES_PASSWORD: cinesense_secret_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Vite Bundle
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Backend Dependencies
        run: |
          cd backend
          uv sync

      - name: Run Backend Unit Tests
        env:
          DATABASE_URL: postgresql+asyncpg://cinesense:cinesense_secret_pass@localhost:5432/cinesense
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ENVIRONMENT: test
        run: |
          cd backend
          uv run pytest ../tests/unit -v

  # ── 2. Multi-Stage Docker Container Build Verification ──
  docker-build:
    name: Docker Build Validation
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CineSense Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cinesense:latest
          load: true

      - name: Verify Container Image Integrity
        run: |
          docker images
          docker inspect cinesense:latest
